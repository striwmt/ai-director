name: installers

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:

  licenses:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Generate THIRD_PARTY_LICENSES.md from the locked env
        run: |
          uv sync --frozen --no-dev --extra speech --extra vision \
            --extra embedding --extra web
          uv run python scripts/generate_third_party_licenses.py
      - uses: actions/upload-artifact@v4
        with:
          name: third-party-licenses
          path: THIRD_PARTY_LICENSES.md

  appimage:
    needs: licenses
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: third-party-licenses
      - name: Build AppImage
        run: installer/appimage/build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: AIDirector-linux-appimage
          path: dist/*.AppImage

  windows:
    needs: licenses
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: third-party-licenses
      - name: Stage payload
        run: powershell -File installer/windows/stage.ps1
      - name: Build installer
        run: makensis installer/windows/aidirector.nsi
      - uses: actions/upload-artifact@v4
        with:
          name: AIDirector-windows-setup
          path: dist/AIDirector-Setup.exe

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [appimage, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            *.AppImage
            AIDirector-Setup.exe
            THIRD_PARTY_LICENSES.md
