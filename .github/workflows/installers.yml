# AI Director installer builds
name: installers

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:

  licenses:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Generate THIRD_PARTY_LICENSES.md from the locked env
        run: |
          uv sync --frozen --no-dev --extra speech --extra vision \
            --extra embedding --extra web
          uv run python scripts/generate_third_party_licenses.py
      - uses: actions/upload-artifact@v4
        with:
          name: third-party-licenses
          path: THIRD_PARTY_LICENSES.md

  appimage:
    needs: licenses
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: third-party-licenses
      - name: Build AppImage
        run: installer/appimage/build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: AIDirector-linux-appimage
          path: dist/*.AppImage

  windows:
    needs: licenses
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: third-party-licenses
      - name: Stage payload
        run: powershell -File installer/windows/stage.ps1
      - name: Build installer
        shell: pwsh
        run: |
          # NSIS is not on PATH on the runner image; resolve or install it.
          $nsis = "${env:ProgramFiles(x86)}\NSIS\makensis.exe"
          if (-not (Test-Path $nsis)) {
            choco install nsis -y --no-progress
            $nsis = "${env:ProgramFiles(x86)}\NSIS\makensis.exe"
          }
          New-Item -ItemType Directory -Force dist | Out-Null
          & $nsis installer/windows/aidirector.nsi
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        with:
          name: AIDirector-windows-setup
          path: dist/AIDirector-Setup.exe

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [appimage, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            *.AppImage
            AIDirector-Setup.exe
            THIRD_PARTY_LICENSES.md
