# AI model endpoints. Reference configuration: single RTX 5060 Ti 16GB
# with phase execution (AGENT.md §38/§39). Models are replaceable parts —
# change them here, never in code.

models:

  vision:
    provider: transformers               # or: openai-compatible + base_url
    model: Qwen/Qwen3-VL-4B-Instruct
    device: auto

  # e.g.: llama-server -hf Qwen/Qwen3-8B-GGUF:Q4_K_M --port 8102 -ngl 99 \
  #         -c 16384 -fa on --jinja --reasoning-budget 0
  director:
    provider: openai-compatible
    base_url: http://127.0.0.1:8102/v1
    model: qwen3-8b-q4
    context_length: 16384

  speech:
    provider: faster-whisper
    model: large-v3-turbo
    device: auto
    compute_type: float16

  embedding:
    provider: sentence-transformers      # official path for Qwen3-VL-Embedding
    model: Qwen/Qwen3-VL-Embedding-2B
    device: auto
