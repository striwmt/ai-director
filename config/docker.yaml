# Overrides applied inside the Docker image (AIDIRECTOR_CONFIG points here).
# Merged on top of config/default.yaml + config/models.yaml.

paths:
  data_dir: /workspace/.aidirector    # persisted via the /workspace volume

models:
  # The Director LLM runs in the sibling `director-llm` compose service
  # (llama.cpp server). Vision / speech / embedding run in-process.
  director:
    provider: openai-compatible
    base_url: http://director-llm:8102/v1
    model: qwen3-8b-q4
    context_length: 16384
